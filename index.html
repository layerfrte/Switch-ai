<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwitchAI • Black</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white overflow-hidden">
  <div class="flex flex-col h-screen">
    
    <!-- Header -->
    <header class="h-14 bg-zinc-950 border-b border-zinc-800 flex items-center px-4">
      <div class="flex-1"></div>
      <h1 class="text-2xl font-bold tracking-tighter text-center">SwitchAI</h1>
      <div class="flex-1"></div>
    </header>

    <!-- Chat -->
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-6 bg-black"></div>

    <!-- Input Area -->
    <div class="input-container p-4 bg-zinc-950 border-t border-zinc-800">
      <div class="max-w-4xl mx-auto">
        <div class="flex gap-3">
          <input id="userInput" 
                 class="flex-1 bg-zinc-900 border border-zinc-700 rounded-3xl px-6 py-5 focus:outline-none focus:border-purple-600 text-lg"
                 placeholder="Напишите сообщение...">
          <button onclick="sendMessage()" 
                  class="w-14 h-14 bg-purple-600 hover:bg-purple-500 rounded-3xl flex items-center justify-center transition-all active:scale-95">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <div id="status" class="text-center text-sm mt-3 text-red-400 min-h-[24px]"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
